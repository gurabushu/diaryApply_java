<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>つぶやき日記</title>

	<style>
		*{
			padding: 0;
			margin:0;
		}
		
	
		.nav a {
			background-color: #333;
			border-radius: 8px;
			padding: 18px;

		}

		a {
			text-decoration: none;
			color: white;
		}

		.main-nav-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin: 18px;

		}
		
		footer p{
			text-align: center;
			background-color: #333;
			color:white;
			
		}
		
		h2{
			text-align: center;
		}
	
		.diary-list{
			width: 60%;
			margin:auto;
			text-align: center;
			
			
		}
		
		.diary-card-body{
			border: solid black 1px;
			
		}
		
		.diary-card-body{
			margin:28px;
			
		}
		
		h3{
			margin-bottom:38px;
			margin-top:18px;
		}
		
		.diary-card-body p{
			margin:18px;
			
		}
		
	</style>
</head>

<body>
	<div class="main-nav-header">
		<h1>日記アプリ</h1>

		<nav class="nav">
			<a th:href="@{/new}">日記を書く</a>
			<a th:href="@{/logout}">ログアウト</a>
		</nav>
	</div>
	
	<h2>日記一覧</h2>
	
	<div class="diary-list">
		<div class="diary-card" th:each="diary : ${diaries}">
			<p th:text="'日記件数：'+ ${#lists.size(diaries)}"></p>
			<div class="diary-card-body">
			<h3 th:text="${diary.title}"></h3>
			<p th:text="${diary.body}"></p>
			</div>
		</div>
	</div>
	



	<footer>
		<p>© 2026 Tsubuyaki Diary. All Rights Reserved.</p>
	</footer>




</body>

</html>
